# Actions to get information about the node, container and charm
get-node-info:
  description: |
    Gets system information about the node and its container.
get-node-help:
  description: |
    Gets the help information from the client binary.
    Note that to get a readable output it is recommended to use '--format json' and parse the output with the 'jq' command line tool.
    Example Juju 2.x: juju run-action --wait polkadot/0 get-node-help --format json | jq -r '.["unit-polkadot-0"].results["help-output"]'
    Example Juju 3.x: juju run polkadot/0 get-node-help --format json | jq -r '.["polkadot/0"].results["help-output"]'
print-readme:
  description: |
    Prints the README file for the charm.

# Actions to manage the node service
restart-node-service:
  description: "This actions restarts the service running the blockchain node."
start-node-service:
  description: "This actions starts the service running the blockchain node."
stop-node-service:
  description: "This actions stops the service running the blockchain node."

# Actions to manage keys
get-session-key:
  description: "Runs author_rotateKeys and returns a new session-key."
get-session-key-with-owner:
  description: "Runs author_rotateKeysWithOwner for the supplied owner address and returns a new session-key with ownership proof."
  params:
    address:
      description: "Owner address used to generate the ownership proof. E.g. address='DuLr6CeLXezrfumF6EkqLeAx9paMcADYU6zHpSZVB8gvjht'"
      type: string
  required: [ address ]
has-session-key:
  description: "Checks possession of the complete supplied session-key bundle, including auxiliary keys. Does not check election or production."
  params:
    key:
      description: "Key to check if exist on node. E.g. key='0xhjd39djk309'"
      type: string
  required: [ key ]
insert-key:
  description: |
    Inserts a key in the keystore of the node using a local RPC call. WARNING: don't do double signing by inserting the same key for two nodes!
    Keys are generated using the external tool subkey (not provided by the charm) E.g 'subkey generate --network efinity'
  params:
    key-type:
      description: "Four-character runtime key type, for example aura, babe, gran or ofcw."
      type: string
      default: aura
    mnemonic:
      description: "The private part of the key as a seed phrase. E.g. mnemonic='reunion learn town satisfy social split ticket improve sunset faculty tail adjust'"
      type: string
    address:
      description: "The public part of the key in hex format. E.g. address='0xf0014b9f4b10ac206a0f3ba9630e1df1f80214e7724e96ab00ccb35d08045777'"
      type: string
  required: [ mnemonic, address ]
set-node-key:
  description: |
    Sets a new private key in the node key file for this Juju application and restarts the node service.
    A node key can be generated with the external tool subkey (not provided by the charm) E.g. `subkey generate-node-key --file node-key`.
    The content of node-key is the private key and what should be used for the 'key' parameter.
  params:
    key:
      description: Private node key.
      type: string
  required: [ key ]

# Actions to manage a validator node
find-validator-address:
  description: |
    Finds a locally held key in the current finalized BABE/Aura authority set.
    Reports the authority address/key and, when applicable, missing queued keys.
    This checks authority-key possession, not recent block production.
    The session-key result is included only if the queued bundle uses the same
    consensus key. Queued keys can already target another node after rotation.
is-validating-next-era:
  description: |
    Legacy action name: checks registered Session.NextKeys and local possession
    of each key. Reports missing keys separately. Registration does not prove
    election, activation in the next era, or block production.
  params:
    address:
      description: |
        The public address to check. E.g. DuLr6CeLXezrfumF6EkqLeAx9paMcADYU6zHpSZVB8gvjht
      type: string
  required: [ address ]
start-validating:
  description: |
    Generates and registers session keys using mnemonic-secret-id, optionally
    through a proxy. Validates runtime key/signing support before generating keys.
    Registration does not bond funds, declare validation intent, register a
    collator candidate, enable authority mode, or establish election/activation.
    The signer must have funds to pay transaction fees.
  params:
    address:
      description: |
        Optional! The public address to start validating for. E.g. DuLr6CeLXezrfumF6EkqLeAx9paMcADYU6zHpSZVB8gvjht
        Only needed if the node should start validating for a different address than the one in the config parameter 'mnemonic-secret-id'.
        This is typically the case for proxy accounts. I.e. if 'mnemonic-secret-id' is the mnemonic of a proxy account, this parameter should be the address of the validator account.
      type: string

migrate-data:
  description: Migrate Polkadot data from legacy location to snap common directory
  params:
    dry-run:
      type: boolean
      description: Perform a dry run without actually moving data
      default: false
    reverse:
      type: boolean
      description: Undo the migration by moving data back to the legacy location
      default: false
    snap-name:
      type: string
      description: Name of the snap
      enum: [ polkadot, polkadot-parachain ]

migrate-node-key:
  description: Migrate the node key from legacy location to snap common directory
  params:
    dry-run:
      type: boolean
      description: Perform a dry run without actually moving the node key
      default: false
    reverse:
      type: boolean
      description: Undo the migration by moving the node key back to the legacy location
      default: false
    snap-name:
      type: string
      description: Name of the snap
      enum: [ polkadot, polkadot-parachain ]

snap-refresh:
  description: |
    Will run snap refresh for the Polkadot snap.
    NOTE: If the endure config is set to 'true' you will need to restart the service with 'restart-node-service' to make it run with the new version.
