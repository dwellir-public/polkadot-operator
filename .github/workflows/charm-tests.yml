name: Charm Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  charm-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run charm tests
        run: make charm-test

  charm-pack:
    name: Pack charm (${{ matrix.platform }})
    needs: charm-tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: ubuntu@22.04:amd64
          - runner: ubuntu-24.04
            platform: ubuntu@24.04:amd64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Charmcraft
        run: sudo snap install charmcraft --classic --channel latest/stable

      - name: Pack charm
        env:
          CHARM_PLATFORM: ${{ matrix.platform }}
        run: sudo charmcraft pack --quiet --destructive-mode --platform "$CHARM_PLATFORM"

  actionlint:
    name: Check GitHub workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
