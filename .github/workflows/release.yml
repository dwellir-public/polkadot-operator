name: Release Charm to Charmhub and GitHub

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polkadot-release
  cancel-in-progress: false

env:
  RELEASE_CHANNEL: latest/edge

jobs:
  unit-tests:
    if: github.ref == 'refs/heads/main' && github.repository == 'dwellir-public/polkadot-operator'
    name: Run charm checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run charm checks
        run: make charm-test

  build-ubuntu-22:
    if: github.ref == 'refs/heads/main' && github.repository == 'dwellir-public/polkadot-operator'
    name: Build charm on ubuntu-22.04
    needs:
      - unit-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Charmcraft
        run: sudo snap install charmcraft --classic --channel latest/stable

      - name: Build charm for ubuntu@22.04:amd64
        run: sudo charmcraft pack --quiet --destructive-mode --platform ubuntu@22.04:amd64

      - name: Checksum charm artifact
        run: sha256sum polkadot_ubuntu@22.04-amd64.charm > polkadot_ubuntu@22.04-amd64.charm.sha256

      - name: Upload charm artifact (ubuntu@22.04:amd64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: charm-ubuntu-22-amd64
          path: |
            ./polkadot_ubuntu@22.04-amd64.charm
            ./polkadot_ubuntu@22.04-amd64.charm.sha256
          if-no-files-found: error

  build-ubuntu-24:
    if: github.ref == 'refs/heads/main' && github.repository == 'dwellir-public/polkadot-operator'
    name: Build charm on ubuntu-24.04
    needs:
      - unit-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Charmcraft
        run: sudo snap install charmcraft --classic --channel latest/stable

      - name: Build charm for ubuntu@24.04:amd64
        run: sudo charmcraft pack --quiet --destructive-mode --platform ubuntu@24.04:amd64

      - name: Checksum charm artifact
        run: sha256sum polkadot_ubuntu@24.04-amd64.charm > polkadot_ubuntu@24.04-amd64.charm.sha256

      - name: Upload charm artifact (ubuntu@24.04:amd64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: charm-ubuntu-24-amd64
          path: |
            ./polkadot_ubuntu@24.04-amd64.charm
            ./polkadot_ubuntu@24.04-amd64.charm.sha256
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'dwellir-public/polkadot-operator'
    name: Release to Charmhub
    environment: edge
    needs:
      - build-ubuntu-22
      - build-ubuntu-24
    runs-on: ubuntu-latest
    outputs:
      rev_ubuntu_22: ${{ steps.upload_ubuntu_22.outputs.revision }}
      rev_ubuntu_24: ${{ steps.upload_ubuntu_24.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download built charm artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: charm-ubuntu-*-amd64
          merge-multiple: true
          path: .

      - name: Verify charm checksums
        run: |
          sha256sum --check polkadot_ubuntu@22.04-amd64.charm.sha256
          sha256sum --check polkadot_ubuntu@24.04-amd64.charm.sha256

      - name: Install Charmcraft
        run: sudo snap install charmcraft --classic --channel latest/stable

      - name: Upload ubuntu@22.04 charm to Charmhub edge
        id: upload_ubuntu_22
        env:
          CHARMCRAFT_AUTH: "${{ secrets.CHARMHUB_TOKEN }}"
        run: |
          set -euo pipefail

          output="$(charmcraft upload --format json --release "$RELEASE_CHANNEL" ./polkadot_ubuntu@22.04-amd64.charm)"
          echo "$output"

          revision="$(python3 -c 'import json, sys; print(json.loads(sys.stdin.read())["revision"])' <<< "$output")"
          if [[ -z "$revision" ]]; then
            echo "Failed to parse uploaded revision for ubuntu@22.04 charm" >&2
            exit 1
          fi

          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Upload ubuntu@24.04 charm to Charmhub edge
        id: upload_ubuntu_24
        env:
          CHARMCRAFT_AUTH: "${{ secrets.CHARMHUB_TOKEN }}"
        run: |
          set -euo pipefail

          output="$(charmcraft upload --format json --release "$RELEASE_CHANNEL" ./polkadot_ubuntu@24.04-amd64.charm)"
          echo "$output"

          revision="$(python3 -c 'import json, sys; print(json.loads(sys.stdin.read())["revision"])' <<< "$output")"
          if [[ -z "$revision" ]]; then
            echo "Failed to parse uploaded revision for ubuntu@24.04 charm" >&2
            exit 1
          fi

          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  github-release:
    if: github.ref == 'refs/heads/main' && github.repository == 'dwellir-public/polkadot-operator'
    name: Create GitHub release
    needs:
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download built charm artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: charm-ubuntu-*-amd64
          merge-multiple: true
          path: .

      - name: Verify charm checksums
        run: |
          sha256sum --check polkadot_ubuntu@22.04-amd64.charm.sha256
          sha256sum --check polkadot_ubuntu@24.04-amd64.charm.sha256

      - name: Build release metadata from Charmhub revisions
        id: release_meta
        run: |
          set -euo pipefail

          channel="$RELEASE_CHANNEL"
          rev22='${{ needs.release.outputs.rev_ubuntu_22 }}'
          rev24='${{ needs.release.outputs.rev_ubuntu_24 }}'

          if [[ -z "$rev22" || -z "$rev24" ]]; then
            echo "Missing Charmhub revision outputs from release job" >&2
            exit 1
          fi

          tag="${channel//\//-}-r${rev22}-r${rev24}"
          name="Charm release ${tag}"

          {
            echo "tag=$tag"
            echo "name=$name"
            echo "body<<EOF"
            echo "Published to Charmhub channel \`${channel}\`."
            echo
            echo "- ubuntu@22.04:amd64 revision: \`${rev22}\`"
            echo "- ubuntu@24.04:amd64 revision: \`${rev24}\`"
            echo
            echo "Source commit: \`${GITHUB_SHA}\`."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and upload charm artifacts
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.release_meta.outputs.body }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ./polkadot_ubuntu@22.04-amd64.charm
            ./polkadot_ubuntu@22.04-amd64.charm.sha256
            ./polkadot_ubuntu@24.04-amd64.charm
            ./polkadot_ubuntu@24.04-amd64.charm.sha256
